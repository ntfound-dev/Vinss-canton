[package]
name = "vinss_mls"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WASM bridge for VINSS secure messaging using OpenMLS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"

openmls = { version = "0.9.0", features = ["js"] }
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"

tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }

# Required by the Rust crypto provider when compiled for browser WASM.
getrandom_old = { package = "getrandom", version = "0.2.15", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
