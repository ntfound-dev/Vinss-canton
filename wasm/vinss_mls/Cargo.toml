[package]
name = "vinss_mls"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WASM bridge for VINSS secure messaging using OpenMLS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
openmls = { version = "0.9.0", features = ["js"] }

# Crypto/storage provider wiring is intentionally added only when the
# browser persistence design is finalized. Do not ship custom crypto.

[profile.release]
opt-level = "s"
lto = true
