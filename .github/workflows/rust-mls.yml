name: Rust MLS

on:
  push:
    paths:
      - "wasm/vinss_mls/**"
      - ".github/workflows/rust-mls.yml"
  pull_request:
    paths:
      - "wasm/vinss_mls/**"
      - ".github/workflows/rust-mls.yml"

permissions:
  contents: read

jobs:
  alice-bob-mls:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Run real OpenMLS lifecycle test
        run: >
          cargo test
          --manifest-path wasm/vinss_mls/Cargo.toml
          --test alice_bob
          -- --nocapture
