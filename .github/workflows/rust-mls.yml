name: Rust MLS

on:
  push:
    paths:
      - "wasm/vinss_mls/**"
      - "src/messaging/openmls/**"
      - "src/messaging/types.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/rust-mls.yml"
  pull_request:
    paths:
      - "wasm/vinss_mls/**"
      - "src/messaging/openmls/**"
      - "src/messaging/types.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/rust-mls.yml"

permissions:
  contents: read

jobs:
  mls:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install TypeScript dependencies
        run: npm ci

      - name: Compile browser bridge
        run: npx tsc

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Run OpenMLS lifecycle test
        run: >
          cargo test
          --manifest-path wasm/vinss_mls/Cargo.toml
          --test alice_bob
          -- --nocapture

      - name: Build browser WASM
        run: >
          cargo build
          --manifest-path wasm/vinss_mls/Cargo.toml
          --release
          --target wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: >
          cargo install wasm-bindgen-cli
          --version 0.2.128
          --locked

      - name: Generate browser bindings
        run: |
          rm -rf wasm/vinss_mls/pkg

          wasm-bindgen \
            wasm/vinss_mls/target/wasm32-unknown-unknown/release/vinss_mls.wasm \
            --out-dir wasm/vinss_mls/pkg \
            --target web \
            --typescript

          test -f wasm/vinss_mls/pkg/vinss_mls.js
          test -f wasm/vinss_mls/pkg/vinss_mls.d.ts
          test -f wasm/vinss_mls/pkg/vinss_mls_bg.wasm

      - name: Run Alice Bob browser WASM smoke
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(
            command -v google-chrome ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"

          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi

          python3 -m http.server 4173 \
            --bind 127.0.0.1 \
            > /tmp/vinss-http.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS \
              http://127.0.0.1:4173/wasm/vinss_mls/browser-smoke/ \
              >/dev/null; then
              break
            fi

            sleep 0.5
          done

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=15000 \
            --dump-dom \
            http://127.0.0.1:4173/wasm/vinss_mls/browser-smoke/ \
            > /tmp/vinss-browser.html \
            2> /tmp/vinss-chrome.log

          cat /tmp/vinss-browser.html

          grep -q \
            "VINSS MLS BROWSER SMOKE: PASS" \
            /tmp/vinss-browser.html

      - name: Upload browser WASM package
        uses: actions/upload-artifact@v4
        with:
          name: vinss-mls-browser
          path: wasm/vinss_mls/pkg/
