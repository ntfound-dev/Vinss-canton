name: Canton Integration

on:
  push:
    paths:
      - "daml/**"
      - "daml.yaml"
      - "src/canton/**"
      - "src/messaging/canton/**"
      - "src/messaging/openmls/**"
      - "src/messaging/types.ts"
      - "src/messaging/content.ts"
      - "wasm/vinss_mls/**"
      - "tests/integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/canton-integration.yml"

  pull_request:
    paths:
      - "daml/**"
      - "daml.yaml"
      - "src/canton/**"
      - "src/messaging/canton/**"
      - "src/messaging/openmls/**"
      - "src/messaging/types.ts"
      - "src/messaging/content.ts"
      - "wasm/vinss_mls/**"
      - "tests/integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/canton-integration.yml"

permissions:
  contents: read

jobs:
  real-canton:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build OpenMLS WASM
        run: >
          cargo build
          --manifest-path wasm/vinss_mls/Cargo.toml
          --release
          --target wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: >
          cargo install wasm-bindgen-cli
          --version 0.2.128
          --locked

      - name: Generate Node OpenMLS bindings
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            wasm/vinss_mls/pkg-node

          wasm-bindgen \
            wasm/vinss_mls/target/wasm32-unknown-unknown/release/vinss_mls.wasm \
            --out-dir wasm/vinss_mls/pkg-node \
            --target nodejs

          # wasm-bindgen --target nodejs emits CommonJS.
          # Override the repository-level "type": "module"
          # for this generated package only.
          printf '%s\n' \
            '{"type":"commonjs"}' \
            > wasm/vinss_mls/pkg-node/package.json

          test -f \
            wasm/vinss_mls/pkg-node/vinss_mls.js

          test -f \
            wasm/vinss_mls/pkg-node/vinss_mls_bg.wasm

          test -f \
            wasm/vinss_mls/pkg-node/package.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install DPM
        shell: bash
        run: |
          curl -fsSL \
            https://get.digitalasset.com/install/install.sh \
            | sh

          echo "$HOME/.dpm/bin" \
            >> "$GITHUB_PATH"

      - name: Install Daml SDK
        run: dpm install 3.5.10

      - name: Build VINSS DAR
        run: dpm build

      - name: Start real Canton sandbox
        shell: bash
        run: |
          set -euo pipefail

          DAR="$(
            find .daml/dist \
              -type f \
              -name '*.dar' \
              | head -n 1
          )"

          test -n "$DAR"

          echo "Using DAR: $DAR"

          nohup dpm sandbox \
            --json-api-port 7575 \
            --dar "$DAR" \
            > /tmp/vinss-canton.log \
            2>&1 &

          echo $! \
            > /tmp/vinss-canton.pid

          ready=0

          for attempt in $(seq 1 90); do
            SYNCHRONIZERS="$(
              curl -fsS \
                http://127.0.0.1:7575/v2/state/connected-synchronizers \
                2>/dev/null \
                || true
            )"

            if echo "$SYNCHRONIZERS" \
              | jq -e \
                '.connectedSynchronizers | length > 0' \
                >/dev/null 2>&1; then
              ready=1

              echo \
                "Connected synchronizers:"

              echo "$SYNCHRONIZERS" \
                | jq .

              break
            fi

            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo \
              "Canton participant did not connect to synchronizer"

            cat \
              /tmp/vinss-canton.log

            exit 1
          fi

      - name: Run raw Canton messaging smoke
        env:
          CANTON_BASE_URL: http://127.0.0.1:7575
        run: >
          node
          tests/integration/canton-real-smoke.mjs

      - name: Run true OpenMLS Canton E2E
        env:
          CANTON_BASE_URL: http://127.0.0.1:7575
        run: >
          node
          tests/integration/canton-openmls-e2e.mjs

      - name: Show Canton log on failure
        if: failure()
        run: |
          cat /tmp/vinss-canton.log || true

      - name: Stop Canton
        if: always()
        run: |
          if [ -f /tmp/vinss-canton.pid ]; then
            kill "$(
              cat /tmp/vinss-canton.pid
            )" 2>/dev/null || true
          fi
